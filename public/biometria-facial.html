<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biometria Facial — Garota VIP Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Carrega face-api.js para reconhecimento facial real no navegador -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top center, #131b31 0%, #070a12 65%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #0f1523;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f472b6;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; line-height: 1.45; margin-bottom: 18px; }

    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      border: 2px solid #1e293b;
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .oval-guide {
      position: absolute;
      inset: 13% 18%;
      border: 3px dashed #ec4899;
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(7, 10, 18, 0.58);
      pointer-events: none;
      transition: border-color 0.3s ease;
    }
    .scan-line {
      position: absolute;
      left: 18%;
      right: 18%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ec4899, #a78bfa, transparent);
      box-shadow: 0 0 12px #ec4899;
      animation: scanMove 2.2s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes scanMove {
      0%, 100% { top: 20%; opacity: 0.4; }
      50% { top: 78%; opacity: 1; }
    }
    .status-pill {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #ec4899;
      color: #fff;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      backdrop-filter: blur(6px);
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 2;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-back {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">💎 Garota VIP Security</div>
    <h1 id="page-title">Biometria Facial</h1>
    <p id="page-subtitle" class="subtitle">Enquadre seu rosto dentro da moldura oval para continuar.</p>

    <div class="camera-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div id="oval-guide" class="oval-guide"></div>
      <div id="scan-line" class="scan-line"></div>
      <div id="status-pill" class="status-pill">⏳ Carregando IA facial...</div>
    </div>

    <div class="actions">
      <button type="button" class="btn-back" onclick="cancelar()">Voltar</button>
      <button type="button" id="main-btn" class="btn" disabled onclick="confirmarRosto()">Aguardando rosto...</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'register'; // 'register' | 'unlock'
    const token = sessionStorage.getItem('portal_token') || '';
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    const MATCH_THRESHOLD = 0.50; // Quanto menor, mais rigoroso (0.50 é padrão bancário)

    let stream = null;
    let scanInterval = null;
    let latestDescriptor = null;
    let isUnlocked = false;

    if (!token) {
      window.location.href = '/minha-conta/editar';
    }

    const titleEl = document.getElementById('page-title');
    const subEl = document.getElementById('page-subtitle');
    const pillEl = document.getElementById('status-pill');
    const ovalEl = document.getElementById('oval-guide');
    const scanEl = document.getElementById('scan-line');
    const mainBtn = document.getElementById('main-btn');
    const videoEl = document.getElementById('cam-video');

    if (mode === 'unlock') {
      titleEl.innerText = 'Verificação Facial (2FA)';
      subEl.innerText = 'Olhe para a câmera para comparar sua biometria e liberar o Studio.';
      mainBtn.style.display = 'none';
    } else {
      titleEl.innerText = 'Cadastrar Biometria Facial';
      subEl.innerText = 'Posicione seu rosto bem iluminado dentro da moldura oval.';
      mainBtn.innerText = '● Cadastrar Rosto';
    }

    function euclideanDistance(arr1, arr2) {
      let sum = 0;
      for (let i = 0; i < arr1.length; i++) {
        const diff = arr1[i] - arr2[i];
        sum += diff * diff;
      }
      return Math.sqrt(sum);
    }

    async function initFaceEngine() {
      try {
        // Aguarda script do face-api carregar
        while (!window.faceapi) {
          await new Promise(r => setTimeout(r, 100));
        }

        pillEl.innerText = '⏳ Carregando modelos neurais...';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        ]);

        pillEl.innerText = '📷 Abrindo câmera frontal...';
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        videoEl.srcObject = stream;
        await new Promise(r => (videoEl.onloadedmetadata = r));
        await videoEl.play();

        startRealDetectionLoop();
      } catch (err) {
        alert('Erro ao iniciar câmera ou modelos faciais. Verifique a permissão da câmera.');
        cancelar();
      }
    }

    function startRealDetectionLoop() {
      const savedRaw = localStorage.getItem('face_descriptor');
      const savedDescriptor = savedRaw ? JSON.parse(savedRaw) : null;

      // Se entrou em modo unlock sem biometria salva, redireciona para cadastro
      if (mode === 'unlock' && !savedDescriptor) {
        window.location.href = '/biometria-facial?mode=register';
        return;
      }

      scanInterval = setInterval(async () => {
        if (isUnlocked || videoEl.paused || videoEl.ended) return;

        const detection = await faceapi
          .detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 }))
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (!detection) {
          latestDescriptor = null;
          ovalEl.style.borderColor = '#ec4899';
          pillEl.style.borderColor = '#ec4899';
          pillEl.innerText = '🔍 Nenhum rosto detectado...';
          if (mode === 'register') {
            mainBtn.disabled = true;
            mainBtn.innerText = 'Posicione seu rosto';
          }
          return;
        }

        // Rosto humano real detectado!
        latestDescriptor = Array.from(detection.descriptor);

        if (mode === 'register') {
          ovalEl.style.borderColor = '#10b981';
          pillEl.style.borderColor = '#10b981';
          pillEl.innerText = '✅ Rosto mapeado! Pronto para salvar';
          mainBtn.disabled = false;
          mainBtn.innerText = '● Salvar Biometria Facial';
          return;
        }

        // Modo unlock: compara os 128 pontos faciais com o rosto cadastrado
        const dist = euclideanDistance(latestDescriptor, savedDescriptor);

        if (dist < MATCH_THRESHOLD) {
          isUnlocked = true;
          clearInterval(scanInterval);
          ovalEl.style.borderColor = '#10b981';
          pillEl.style.borderColor = '#10b981';
          scanEl.style.display = 'none';
          pillEl.innerText = '✅ Identidade confirmada!';

          setTimeout(() => {
            stopCamera();
            sessionStorage.setItem('bio_verified', '1');
            window.location.href = '/minha-conta';
          }, 800);
        } else {
          ovalEl.style.borderColor = '#ef4444';
          pillEl.style.borderColor = '#ef4444';
          pillEl.innerText = '❌ Rosto não compatível com o titular';
        }
      }, 650);
    }

    function stopCamera() {
      if (scanInterval) clearInterval(scanInterval);
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function cancelar() {
      stopCamera();
      if (mode === 'unlock') {
        sessionStorage.removeItem('portal_token');
        sessionStorage.removeItem('bio_verified');
      }
      window.location.href = '/minha-conta';
    }

    function confirmarRosto() {
      if (!latestDescriptor || latestDescriptor.length !== 128) {
        return alert('Mantenha seu rosto centralizado na moldura até ficar verde.');
      }

      mainBtn.disabled = true;
      mainBtn.innerText = 'Salvando biometria...';

      localStorage.setItem('face_descriptor', JSON.stringify(latestDescriptor));
      localStorage.setItem('bio_enabled', '1');
      sessionStorage.setItem('bio_verified', '1');

      ovalEl.style.borderColor = '#10b981';
      scanEl.style.display = 'none';
      pillEl.innerText = '✅ Biometria facial salva com sucesso!';

      setTimeout(() => {
        stopCamera();
        window.location.href = '/minha-conta';
      }, 800);
    }

    window.addEventListener('load', initFaceEngine);
  </script>
</body>
</html>
