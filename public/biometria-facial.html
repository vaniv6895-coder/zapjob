<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biometria Facial — Garota VIP Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top center, #131b31 0%, #070a12 65%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #0f1523;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f472b6;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; line-height: 1.45; margin-bottom: 18px; }

    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      border: 2px solid #1e293b;
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .oval-guide {
      position: absolute;
      inset: 13% 18%;
      border: 3px dashed #ec4899;
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(7, 10, 18, 0.58);
      pointer-events: none;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .scan-line {
      position: absolute;
      left: 18%;
      right: 18%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ec4899, #a78bfa, transparent);
      box-shadow: 0 0 12px #ec4899;
      animation: scanMove 2.2s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes scanMove {
      0%, 100% { top: 20%; opacity: 0.4; }
      50% { top: 78%; opacity: 1; }
    }
    .status-pill {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #ec4899;
      color: #fff;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 2;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-back {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">💎 Garota VIP Security</div>
    <h1 id="page-title">Biometria Facial</h1>
    <p id="page-subtitle" class="subtitle">Enquadre seu rosto dentro da moldura oval para continuar.</p>

    <div class="camera-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div id="oval-guide" class="oval-guide"></div>
      <div id="scan-line" class="scan-line"></div>
      <div id="status-pill" class="status-pill">🔍 Iniciando câmera...</div>
    </div>

    <div class="actions">
      <button type="button" class="btn-back" onclick="cancelar()">Voltar</button>
      <button type="button" id="main-btn" class="btn" onclick="confirmarRosto()">● Ativar Biometria</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'register'; // 'register' | 'unlock'
    const token = sessionStorage.getItem('portal_token') || '';
    let stream = null;

    if (!token) {
      window.location.href = '/minha-conta';
    }

    const titleEl = document.getElementById('page-title');
    const subEl = document.getElementById('page-subtitle');
    const pillEl = document.getElementById('status-pill');
    const ovalEl = document.getElementById('oval-guide');
    const scanEl = document.getElementById('scan-line');
    const mainBtn = document.getElementById('main-btn');

    if (mode === 'unlock') {
      titleEl.innerText = 'Verificação Facial (2FA)';
      subEl.innerText = 'Olhe para a câmera para confirmar sua identidade e entrar no Studio.';
      mainBtn.style.display = 'none';
    } else {
      titleEl.innerText = 'Ativar Biometria Facial';
      subEl.innerText = 'Cadastre seu rosto para proteger o acesso após o login com Gmail.';
      mainBtn.innerText = '● Cadastrar Rosto';
    }

    function b64urlToBuf(b64url) {
      const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(b64);
      return Uint8Array.from(bin, c => c.charCodeAt(0)).buffer;
    }
    function bufToB64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false,
        });
        document.getElementById('cam-video').srcObject = stream;

        setTimeout(() => {
          pillEl.innerText = '⏳ Identificando rosto...';
          ovalEl.style.borderColor = '#f59e0b';
        }, 900);

        setTimeout(() => {
          pillEl.innerText = '✅ Rosto identificado!';
          ovalEl.style.borderColor = '#10b981';
          scanEl.style.display = 'none';

          // Se estiver no modo desbloqueio (pós-Gmail), libera e entra no painel automaticamente
          if (mode === 'unlock') {
            setTimeout(() => {
              stopCamera();
              sessionStorage.setItem('bio_verified', '1');
              window.location.href = '/minha-conta';
            }, 900);
          }
        }, 2600);
      } catch (err) {
        alert('Não foi possível abrir a câmera frontal. Verifique as permissões do navegador.');
        cancelar();
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function cancelar() {
      stopCamera();
      if (mode === 'unlock') {
        sessionStorage.removeItem('portal_token');
        sessionStorage.removeItem('bio_verified');
      }
      window.location.href = '/minha-conta';
    }

    async function confirmarRosto() {
      mainBtn.disabled = true;
      mainBtn.innerText = 'Salvando...';
      pillEl.innerText = '⏳ Registrando biometria...';

      // Tenta vincular também a Passkey nativa do dispositivo se disponível
      try {
        if (window.PublicKeyCredential) {
          const optRes = await fetch('/api/portal/webauthn/register-options', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token },
          }).then(r => r.json());

          if (optRes.ok) {
            const opts = optRes.options;
            opts.challenge = b64urlToBuf(opts.challenge);
            opts.user.id = b64urlToBuf(opts.user.id);
            if (opts.excludeCredentials) {
              opts.excludeCredentials = opts.excludeCredentials.map(c => ({ ...c, id: b64urlToBuf(c.id) }));
            }
            const cred = await navigator.credentials.create({ publicKey: opts });
            const payload = {
              id: cred.id,
              rawId: bufToB64url(cred.rawId),
              type: cred.type,
              response: {
                attestationObject: bufToB64url(cred.response.attestationObject),
                clientDataJSON: bufToB64url(cred.response.clientDataJSON),
                transports: cred.response.getTransports ? cred.response.getTransports() : [],
              },
            };
            await fetch('/api/portal/webauthn/register-verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
              body: JSON.stringify(payload),
            });
          }
        }
      } catch (e) {}

      localStorage.setItem('bio_enabled', '1');
      sessionStorage.setItem('bio_verified', '1');
      pillEl.innerText = '✅ Biometria facial ativada!';

      setTimeout(() => {
        stopCamera();
        alert('✅ Biometria facial ativada com sucesso!');
        window.location.href = '/minha-conta';
      }, 800);
    }

    startCamera();
  </script>
</body>
</html>
