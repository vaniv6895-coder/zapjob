<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FlowBuilder - Construtor Visual de Automação</title>
  <style>
    :root {
      --bg-canvas: #0b111a;
      --grid-dot: #1e293b;
      --panel-bg: #131c2e;
      --border: #26344d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #00a884;
      --accent-hover: #059669;
      --blue: #38bdf8;
      --purple: #a855f7;
      --amber: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: var(--bg-canvas); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

    /* Topbar */
    header {
      height: 54px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 50;
      gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--accent); white-space: nowrap; }
    .brand a { color: var(--text-muted); text-decoration: none; font-size: 12px; background: #1e293b; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); }
    .toolbar-blocks { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
    .toolbar-blocks::-webkit-scrollbar { display: none; }
    .btn-block {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: 0.15s;
    }
    .btn-block:hover { border-color: var(--accent); background: #243249; }
    .dot-type { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .header-actions { display: flex; gap: 6px; align-items: center; }
    .btn-action {
      background: var(--accent);
      color: #06281e;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-action.secondary { background: #1e293b; color: var(--text-main); border: 1px solid var(--border); }
    .btn-action.danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    /* Workspace Canvas */
    #viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-image: radial-gradient(var(--grid-dot) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      touch-action: none;
    }
    #viewport:active { cursor: grabbing; }
    #viewport.connect-mode { cursor: crosshair; }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      width: 6000px;
      height: 6000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    svg#connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    path.wire {
      fill: none;
      stroke: #475569;
      stroke-width: 3.5;
      pointer-events: stroke;
      cursor: pointer;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    path.wire:hover { stroke: var(--danger); stroke-width: 5; }
    path.wire-temp { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-dasharray: 6 6; pointer-events: none; }

    /* Node Cards (Balões) */
    .node {
      position: absolute;
      width: 270px;
      background: #162033;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2.5px rgba(0, 168, 132, 0.35), 0 12px 28px rgba(0,0,0,0.6); }
    .node.snap-target { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.45); }

    .node-header {
      padding: 9px 10px 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      border-radius: 10px 10px 0 0;
      font-size: 12px;
      font-weight: 700;
    }
    .node-title { display: flex; align-items: center; gap: 7px; pointer-events: none; }
    .node-del {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: 0.15s;
      z-index: 15;
    }
    .node-del:hover, .node-del:active { color: #fff; background: var(--danger); border-color: var(--danger); }

    .node-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .node-body label.field-lbl { font-size: 11px; color: var(--text-muted); }
    .node-body textarea, .node-body input, .node-body select {
      width: 100%;
      background: #0d1522;
      border: 1px solid #293852;
      color: var(--text-main);
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 12px;
      outline: none;
      user-select: text;
      resize: vertical;
    }
    .node-body textarea:focus, .node-body input:focus { border-color: var(--accent); }

    /* Ports (Bolinhas de Ligação ampliadas para fácil toque) */
    .port {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #0f172a;
      border: 3.5px solid var(--accent);
      top: 50%;
      transform: translateY(-50%);
      cursor: crosshair;
      z-index: 20;
      transition: transform 0.12s, background 0.12s;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }
    .port:hover, .port.highlight { transform: translateY(-50%) scale(1.35); background: var(--accent); }
    .port-in { left: -13px; border-color: var(--blue); }
    .port-in:hover, .port-in.highlight { background: var(--blue); }
    .port-out { right: -13px; }

    /* Virtual Cursor for Digital Mousepad */
    #virtual-cursor {
      position: fixed;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: rgba(0, 168, 132, 0.55);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 0 14px var(--accent);
      transition: background 0.1s, transform 0.08s;
    }
    #virtual-cursor.clicking {
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(56, 189, 248, 0.85);
    }

    /* Context Menu (Botão Direito) */
    #context-menu {
      position: fixed;
      background: #131c2e;
      border: 1.5px solid #334155;
      border-radius: 10px;
      padding: 6px;
      min-width: 175px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.75);
      z-index: 10000;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .ctx-item {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctx-item:hover { background: #1e293b; }
    .ctx-item.danger { color: #fca5a5; }
    .ctx-item.danger:hover { background: rgba(239, 68, 68, 0.2); }

    /* Digital Mousepad / Trackpad Widget */
    #trackpad-widget {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 265px;
      background: rgba(19, 28, 46, 0.96);
      backdrop-filter: blur(10px);
      border: 1.5px solid #2e4060;
      border-radius: 16px;
      padding: 11px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #trackpad-widget.minimized #tp-body { display: none; }
    .tp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .tp-toggle-min {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    #tp-body { display: flex; flex-direction: column; gap: 8px; }
    .tp-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tp-mode-btn {
      background: #0d1522;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .tp-mode-btn.active {
      background: rgba(0, 168, 132, 0.22);
      border-color: var(--accent);
      color: #fff;
    }
    #touch-surface {
      height: 110px;
      background: linear-gradient(145deg, #0b121e, #111b2d);
      border: 1.5px dashed #364b70;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 11px;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      touch-action: none;
    }
    #touch-surface:active { border-color: var(--accent); background: #0f1929; }

    /* Botões Esquerdo e Direito do Mousepad */
    .tp-mouse-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tp-btn-left {
      background: #1e293b;
      border: 1.5px solid var(--accent);
      color: #fff;
      padding: 9px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tp-btn-left:active, .tp-btn-left.holding { background: var(--accent); color: #04241b; }

    .tp-btn-right {
      background: #1e293b;
      border: 1.5px solid var(--blue);
      color: #fff;
      padding: 9px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tp-btn-right:active { background: var(--blue); color: #041d2e; }

    .tp-zoom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }
    .tp-zoom button {
      flex: 1;
      background: #0d1522;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .tp-zoom button.del-sel {
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    #toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #04241b;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <a href="/painel">← Painel</a>
      <span>⚡ FlowBuilder</span>
    </div>
    <div class="toolbar-blocks">
      <button class="btn-block" onclick="addNode('trigger')"><span class="dot-type" style="background:#38bdf8"></span>+ Gatilho</button>
      <button class="btn-block" onclick="addNode('message')"><span class="dot-type" style="background:#00a884"></span>+ Mensagem</button>
      <button class="btn-block" onclick="addNode('media')"><span class="dot-type" style="background:#ec4899"></span>+ Foto / Áudio / Vídeo</button>
      <button class="btn-block" onclick="addNode('condition')"><span class="dot-type" style="background:#f59e0b"></span>+ Condição</button>
      <button class="btn-block" onclick="addNode('ai')"><span class="dot-type" style="background:#a855f7"></span>+ IA Gemini</button>
      <button class="btn-block" onclick="addNode('delay')"><span class="dot-type" style="background:#94a3b8"></span>+ Espera</button>
    </div>
    <div class="header-actions">
      <button class="btn-action secondary" id="btn-fullscreen" onclick="toggleFullscreen()" title="Tela Cheia">⛶ Tela Cheia</button>
      <button class="btn-action secondary" onclick="exportFlow()">JSON</button>
      <button class="btn-action danger" onclick="resetFlow()">Limpar</button>
      <button class="btn-action" onclick="saveFlow()">Salvar</button>
    </div>
  </header>

  <div id="toast">Fluxo salvo!</div>
  <div id="virtual-cursor"></div>

  <!-- Menu de Contexto (Botão Direito) -->
  <div id="context-menu">
    <button class="ctx-item" id="ctx-link" onclick="ctxAction('link')">🔗 Ligar este balão</button>
    <button class="ctx-item" id="ctx-dup" onclick="ctxAction('duplicate')">📋 Duplicar balão</button>
    <button class="ctx-item" id="ctx-unlink" onclick="ctxAction('unlink')">✂️ Remover ligações</button>
    <button class="ctx-item danger" id="ctx-del" onclick="ctxAction('delete')">🗑️ Excluir balão</button>
  </div>

  <div id="viewport">
    <div id="world">
      <svg id="connections"></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <!-- Mousepad / Trackpad Digital -->
  <div id="trackpad-widget">
    <div class="tp-header">
      <span>🖱️ Mousepad (<span id="zoom-label">100%</span>)</span>
      <button class="tp-toggle-min" onclick="togglePadMinimize()" title="Minimizar/Expandir">▾</button>
    </div>
    <div id="tp-body">
      <div class="tp-modes">
        <button class="tp-mode-btn active" id="mode-cursor" onclick="setPadMode('cursor')">Cursor / Ligar</button>
        <button class="tp-mode-btn" id="mode-pan" onclick="setPadMode('pan')">Mover Tela</button>
      </div>
      <div id="touch-surface">
        <strong style="color:#e2e8f0;margin-bottom:3px;">Área Touch</strong>
        Arraste para mover • Toque para clicar/ligar
      </div>
      <div class="tp-mouse-btns">
        <button class="tp-btn-left" id="btn-left-click"
          onmousedown="leftBtnDown(event)" onmouseup="leftBtnUp(event)"
          ontouchstart="leftBtnDown(event)" ontouchend="leftBtnUp(event)">
          ◀ Esq (Ligar/Mover)
        </button>
        <button class="tp-btn-right" id="btn-right-click"
          onclick="rightBtnClick(event)">
          Dir (Opções) ▶
        </button>
      </div>
      <div class="tp-zoom">
        <button onclick="changeZoom(-0.1)">−</button>
        <button onclick="resetView()">Centro</button>
        <button onclick="changeZoom(0.1)">+</button>
        <button class="del-sel" onclick="deleteSelectedNode()" title="Excluir balão selecionado">🗑️</button>
      </div>
    </div>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const nodesLayer = document.getElementById('nodes-layer');
    const svgLayer = document.getElementById('connections');
    const vCursor = document.getElementById('virtual-cursor');
    const ctxMenu = document.getElementById('context-menu');

    let pan = { x: 80, y: 80 };
    let scale = 1;
    let isPanning = false;
    let panStart = { x: 0, y: 0 };

    let nodes = [];
    let edges = [];
    let draggingNode = null;
    let dragOffset = { x: 0, y: 0 };

    let linkingFrom = null;
    let tempWire = null;
    let selectedNodeId = null;
    let contextTargetNodeId = null;

    // Estado do Mousepad Digital
    let padMode = 'cursor';
    let cursorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let padLastTouch = null;
    let padTouchMoved = false;
    let leftHolding = false;
    let leftHoldTimer = null;

    const NODE_TEMPLATES = {
      trigger: { title: 'Gatilho Inicial', color: '#38bdf8', hasIn: false, hasOut: true, placeholder: 'Ex: Qualquer mensagem recebida', defaultText: 'Cliente iniciou conversa' },
      message: { title: 'Enviar Mensagem', color: '#00a884', hasIn: true, hasOut: true, placeholder: 'Digite a mensagem do balão...', defaultText: 'Oi! Tudo bem? De onde você fala? 😊' },
      media: { title: 'Mídia Pré-Gravada (R2)', color: '#ec4899', hasIn: true, hasOut: true, placeholder: 'Suba um arquivo ou grave áudio abaixo...', defaultText: '' },
      condition: { title: 'Condição / Palavra', color: '#f59e0b', hasIn: true, hasOut: true, placeholder: 'Se mensagem contiver...', defaultText: 'Contém: valor, preço, link' },
      ai: { title: 'Agente IA Gemini', color: '#a855f7', hasIn: true, hasOut: true, placeholder: 'Instrução extra para a IA...', defaultText: 'Identificar cidade vizinha, conversar com persona doce e oferecer Canal de Prévias ou VIP' },
      delay: { title: 'Aguardar (Segundos)', color: '#94a3b8', hasIn: true, hasOut: true, placeholder: 'Segundos (ex: 3)', defaultText: '3' }
    };

    /* TELA CHEIA (FULLSCREEN) */
    function toggleFullscreen() {
      const btn = document.getElementById('btn-fullscreen');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        btn.textContent = '🗗 Sair Tela Cheia';
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        btn.textContent = '⛶ Tela Cheia';
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('btn-fullscreen');
      btn.textContent = document.fullscreenElement ? '🗗 Sair Tela Cheia' : '⛶ Tela Cheia';
    });

    function togglePadMinimize() {
      document.getElementById('trackpad-widget').classList.toggle('minimized');
    }

    async function initDefaultFlow() {
      let pwd = localStorage.getItem('panel_pwd');
      if (!pwd) {
        pwd = prompt('Digite a senha do painel para carregar seus fluxos e mídias:');
        if (pwd) localStorage.setItem('panel_pwd', pwd);
      }

      if (pwd) {
        try {
          const res = await fetch('/api/panel/flow', { headers: { 'x-panel-password': pwd } });
          if (res.ok) {
            const { flow } = await res.json();
            if (flow && Array.isArray(flow.nodes) && flow.nodes.length > 0) {
              nodes = flow.nodes;
              edges = flow.edges || [];
              renderAll();
              return;
            }
          } else if (res.status === 401) {
            localStorage.removeItem('panel_pwd');
          }
        } catch (e) {}
      }

      const saved = localStorage.getItem('zapjob_flow_v1');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          nodes = parsed.nodes || [];
          edges = parsed.edges || [];
          renderAll();
          return;
        } catch (e) {}
      }

      nodes = [
        { id: 'n1', type: 'trigger', x: 60, y: 120, text: 'Cliente mandou primeira mensagem' },
        { id: 'n2', type: 'message', x: 390, y: 100, text: 'Oi amor! Tudo bem? 😊 De qual cidade você fala?' },
        { id: 'n3', type: 'ai', x: 720, y: 120, text: 'Identificar cidade vizinha, conversar e oferecer Canal de Prévias ou VIP' }
      ];
      edges = [
        { id: 'e1', from: 'n1', to: 'n2' },
        { id: 'e2', from: 'n2', to: 'n3' }
      ];
      renderAll();
    }

    function updateTransform() {
      world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${scale})`;
      document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    }

    function addNode(type) {
      const tpl = NODE_TEMPLATES[type];
      const id = 'n_' + Date.now();
      const x = Math.round((-pan.x + viewport.clientWidth / 2 - 135) / scale);
      const y = Math.round((-pan.y + viewport.clientHeight / 2 - 70) / scale);
      nodes.push({ id, type, x, y, text: tpl.defaultText });
      selectNode(id);
      renderAll();
    }

    function selectNode(id) {
      selectedNodeId = id;
      document.querySelectorAll('.node').forEach(n => {
        n.classList.toggle('selected', n.dataset.id === id);
      });
    }

    function deleteNode(id) {
      if (!id) return;
      nodes = nodes.filter(n => n.id !== id);
      edges = edges.filter(e => e.from !== id && e.to !== id);
      if (selectedNodeId === id) selectedNodeId = null;
      if (linkingFrom === id) cancelLinking();
      renderAll();
      showToast('Balão excluído');
    }

    function deleteSelectedNode() {
      if (selectedNodeId) {
        deleteNode(selectedNodeId);
      } else {
        showToast('Selecione ou aponte o cursor para um balão primeiro');
      }
    }

    // Atalho teclado Delete / Backspace para excluir balão selecionado
    window.addEventListener('keydown', e => {
      if (['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName)) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedNodeId) {
        deleteNode(selectedNodeId);
      } else if (e.key === 'Escape') {
        cancelLinking();
        hideContextMenu();
      }
    });

    function renderAll() {
      renderNodes();
      renderEdges();
      updateTransform();
    }

    function renderNodes() {
      nodesLayer.innerHTML = '';
      nodes.forEach(node => {
        const tpl = NODE_TEMPLATES[node.type] || NODE_TEMPLATES.message;
        const el = document.createElement('div');
        el.className = 'node' + (selectedNodeId === node.id ? ' selected' : '');
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        el.dataset.id = node.id;

        let extraMediaControls = '';
        if (node.type === 'media') {
          const isAudio = /\.(ogg|mp3|wav|m4a|webm)$/i.test(node.text) || node.mediaKind === 'audio';
          const isVideo = /\.(mp4|mov|avi)$/i.test(node.text) || node.mediaKind === 'video';
          const isImg = /\.(jpg|jpeg|png|webp|gif)$/i.test(node.text) || node.mediaKind === 'image';

          let previewHtml = '';
          if (node.text && node.text.startsWith('http')) {
            if (isAudio) previewHtml = `<audio src="${node.text}" controls style="width:100%;height:32px;margin-top:4px;"></audio>`;
            else if (isVideo) previewHtml = `<video src="${node.text}" controls style="width:100%;max-height:110px;border-radius:6px;margin-top:4px;"></video>`;
            else if (isImg) previewHtml = `<img src="${node.text}" style="width:100%;max-height:110px;object-fit:cover;border-radius:6px;margin-top:4px;" />`;
          }

          extraMediaControls = `
            <div style="display:flex;gap:5px;margin-top:2px;">
              <label style="flex:1;background:#1e293b;border:1px solid #334155;padding:6px;border-radius:6px;text-align:center;cursor:pointer;color:#38bdf8;font-weight:600;font-size:11px;">
                📁 Subir Arquivo
                <input type="file" accept="audio/*,video/*,image/*" style="display:none;" onchange="uploadPresetMedia(event, '${node.id}')" />
              </label>
              <button type="button" id="rec-btn-${node.id}" onclick="toggleRecordAudio('${node.id}')" style="flex:1;background:#1e293b;border:1px solid #334155;padding:6px;border-radius:6px;cursor:pointer;color:#f43f5e;font-weight:600;font-size:11px;">
                🎙️ Gravar Áudio
              </button>
            </div>
            ${previewHtml}
          `;
        }

        el.innerHTML = `
          ${tpl.hasIn ? `<div class="port port-in" data-port="in" data-node="${node.id}" title="Entrada (Solte ou clique aqui para ligar)"></div>` : ''}
          <div class="node-header" style="border-top: 3px solid ${tpl.color}">
            <span class="node-title"><span class="dot-type" style="background:${tpl.color}"></span>${tpl.title}</span>
            <button type="button" class="node-del" data-del="${node.id}" title="Excluir balão">✕</button>
          </div>
          <div class="node-body">
            <label class="field-lbl">${node.type === 'media' ? 'Link Salvo no Cloudflare R2' : 'Conteúdo / Configuração'}</label>
            <textarea rows="2" placeholder="${tpl.placeholder}">${escapeHtml(node.text)}</textarea>
            ${extraMediaControls}
          </div>
          ${tpl.hasOut ? `<div class="port port-out" data-port="out" data-node="${node.id}" title="Saída (Arraste ou clique para ligar)"></div>` : ''}
        `;

        // Botão X de excluir com suporte direto a mouse e touch
        const delBtn = el.querySelector('.node-del');
        delBtn.addEventListener('mousedown', e => e.stopPropagation());
        delBtn.addEventListener('touchstart', e => e.stopPropagation());
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          deleteNode(node.id);
        });

        const textarea = el.querySelector('textarea');
        textarea.addEventListener('mousedown', e => e.stopPropagation());
        textarea.addEventListener('touchstart', e => e.stopPropagation());
        textarea.addEventListener('input', e => { node.text = e.target.value; });

        // Menu de botão direito nativo no balão
        el.addEventListener('contextmenu', e => {
          e.preventDefault();
          e.stopPropagation();
          selectNode(node.id);
          openContextMenu(e.clientX, e.clientY, node.id);
        });

        // Clique/Arraste no balão (também finaliza ligação se estiver em modo conectar)
        el.addEventListener('mousedown', e => {
          if (e.button === 2) return;
          if (e.target.classList.contains('port') || ['TEXTAREA', 'BUTTON', 'INPUT', 'LABEL'].includes(e.target.tagName)) return;
          e.stopPropagation();
          hideContextMenu();

          if (linkingFrom && linkingFrom !== node.id) {
            finishLinking(node.id);
            return;
          }

          selectNode(node.id);
          draggingNode = node;
          dragOffset.x = (e.clientX - pan.x) / scale - node.x;
          dragOffset.y = (e.clientY - pan.y) / scale - node.y;
        });

        // Soltar linha em qualquer parte do balão conecta automaticamente (Snap fluido)
        el.addEventListener('mouseup', e => {
          if (linkingFrom && linkingFrom !== node.id) {
            e.stopPropagation();
            finishLinking(node.id);
          }
        });

        // Touch direto no balão na tela
        el.addEventListener('touchstart', e => {
          if (e.target.classList.contains('port') || ['TEXTAREA', 'BUTTON', 'INPUT', 'LABEL'].includes(e.target.tagName)) return;
          e.stopPropagation();
          hideContextMenu();
          if (linkingFrom && linkingFrom !== node.id) {
            finishLinking(node.id);
            return;
          }
          selectNode(node.id);
          const t = e.touches[0];
          draggingNode = node;
          dragOffset.x = (t.clientX - pan.x) / scale - node.x;
          dragOffset.y = (t.clientY - pan.y) / scale - node.y;
        }, { passive: true });

        const outPort = el.querySelector('.port-out');
        if (outPort) {
          outPort.addEventListener('mousedown', e => {
            e.stopPropagation();
            startLinking(node.id, e.clientX, e.clientY);
          });
          outPort.addEventListener('touchstart', e => {
            e.stopPropagation();
            const t = e.touches[0];
            startLinking(node.id, t.clientX, t.clientY);
          }, { passive: true });
        }

        const inPort = el.querySelector('.port-in');
        if (inPort) {
          inPort.addEventListener('mouseup', e => {
            e.stopPropagation();
            finishLinking(node.id);
          });
        }

        nodesLayer.appendChild(el);
      });
    }

    async function uploadPresetMedia(event, nodeId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const pwd = localStorage.getItem('panel_pwd') || prompt('Digite a senha do painel para salvar no R2:');
      if (!pwd) return;
      localStorage.setItem('panel_pwd', pwd);

      showToast('Enviando mídia para o Cloudflare R2...');
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch('/api/panel/upload-media', {
        method: 'POST',
        headers: { 'x-panel-password': pwd },
        body: formData
      });

      if (res.ok) {
        const data = await res.json();
        const node = nodes.find(n => n.id === nodeId);
        if (node) {
          node.text = data.url;
          node.mediaKind = data.mimeType.startsWith('audio') ? 'audio' : data.mimeType.startsWith('video') ? 'video' : 'image';
          renderAll();
          await saveFlow(true);
          showToast('Mídia salva no R2 e vinculada ao balão!');
        }
      } else {
        alert('Erro ao enviar mídia. Verifique a senha do painel.');
      }
    }

    let activeRecorder = null;
    let recordedChunks = [];

    async function toggleRecordAudio(nodeId) {
      const btn = document.getElementById('rec-btn-' + nodeId);
      if (activeRecorder && activeRecorder.state === 'recording') {
        activeRecorder.stop();
        btn.textContent = '⏳ Salvando...';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        activeRecorder = new MediaRecorder(stream);
        activeRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        activeRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recordedChunks, { type: 'audio/ogg; codecs=opus' });
          const file = new File([blob], `audio_gravado_${Date.now()}.ogg`, { type: 'audio/ogg' });
          await uploadPresetMedia({ target: { files: [file] } }, nodeId);
        };
        activeRecorder.start();
        btn.textContent = '⏹️ Parar';
        showToast('Gravando áudio... Clique em Parar quando terminar');
      } catch (err) {
        alert('Permita o acesso ao microfone no navegador para gravar áudio.');
      }
    }

    function getPortCoords(nodeId, type) {
      const node = nodes.find(n => n.id === nodeId);
      if (!node) return { x: 0, y: 0 };
      const el = nodesLayer.querySelector(`.node[data-id="${nodeId}"]`);
      const h = el ? el.offsetHeight : 110;
      const w = el ? el.offsetWidth : 270;
      return {
        x: type === 'out' ? node.x + w : node.x,
        y: node.y + h / 2
      };
    }

    function makeBezier(x1, y1, x2, y2) {
      const dx = Math.max(Math.abs(x2 - x1) * 0.5, 60);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    }

    function renderEdges() {
      svgLayer.innerHTML = '';
      edges.forEach(edge => {
        const p1 = getPortCoords(edge.from, 'out');
        const p2 = getPortCoords(edge.to, 'in');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', makeBezier(p1.x, p1.y, p2.x, p2.y));
        path.setAttribute('class', 'wire');
        path.setAttribute('title', 'Clique para remover ligação');
        path.addEventListener('click', e => {
          e.stopPropagation();
          edges = edges.filter(item => item.id !== edge.id);
          renderEdges();
          showToast('Ligação removida');
        });
        svgLayer.appendChild(path);
      });
    }

    function findSnapNode(worldX, worldY) {
      for (const n of nodes) {
        if (n.id === linkingFrom) continue;
        const tpl = NODE_TEMPLATES[n.type] || NODE_TEMPLATES.message;
        if (!tpl.hasIn) continue;
        const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
        const w = el ? el.offsetWidth : 270;
        const h = el ? el.offsetHeight : 110;
        if (worldX >= n.x - 35 && worldX <= n.x + w + 20 && worldY >= n.y - 25 && worldY <= n.y + h + 25) {
          return n;
        }
      }
      return null;
    }

    function startLinking(fromNodeId, clientX, clientY) {
      linkingFrom = fromNodeId;
      selectNode(fromNodeId);
      viewport.classList.add('connect-mode');
      if (tempWire) tempWire.remove();
      tempWire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tempWire.setAttribute('class', 'wire-temp');
      svgLayer.appendChild(tempWire);
      updateTempWire(clientX, clientY);
    }

    function updateTempWire(clientX, clientY) {
      if (!linkingFrom || !tempWire) return;
      const p1 = getPortCoords(linkingFrom, 'out');
      let x2 = (clientX - pan.x) / scale;
      let y2 = (clientY - pan.y) / scale;

      // Ímã visual (Snap) quando aproxima de outro balão
      document.querySelectorAll('.node').forEach(el => el.classList.remove('snap-target'));
      const snapNode = findSnapNode(x2, y2);
      if (snapNode) {
        const pIn = getPortCoords(snapNode.id, 'in');
        x2 = pIn.x;
        y2 = pIn.y;
        const snapEl = nodesLayer.querySelector(`.node[data-id="${snapNode.id}"]`);
        if (snapEl) snapEl.classList.add('snap-target');
      }

      tempWire.setAttribute('d', makeBezier(p1.x, p1.y, x2, y2));
    }

    function finishLinking(toNodeId) {
      document.querySelectorAll('.node').forEach(el => el.classList.remove('snap-target'));
      if (linkingFrom && linkingFrom !== toNodeId) {
        const exists = edges.some(e => e.from === linkingFrom && e.to === toNodeId);
        if (!exists) {
          edges.push({ id: 'e_' + Date.now(), from: linkingFrom, to: toNodeId });
          showToast('Balões conectados!');
        }
      }
      cancelLinking();
      renderEdges();
    }

    function cancelLinking() {
      linkingFrom = null;
      viewport.classList.remove('connect-mode');
      document.querySelectorAll('.node').forEach(el => el.classList.remove('snap-target'));
      if (tempWire) { tempWire.remove(); tempWire = null; }
    }

    /* MENU DE CONTEXTO (BOTÃO DIREITO) */
    function openContextMenu(x, y, nodeId) {
      contextTargetNodeId = nodeId;
      ctxMenu.style.display = 'flex';
      const menuW = 180;
      const menuH = 165;
      ctxMenu.style.left = Math.min(window.innerWidth - menuW - 10, Math.max(10, x)) + 'px';
      ctxMenu.style.top = Math.min(window.innerHeight - menuH - 10, Math.max(60, y)) + 'px';
    }

    function hideContextMenu() {
      ctxMenu.style.display = 'none';
      contextTargetNodeId = null;
    }

    function ctxAction(action) {
      const id = contextTargetNodeId;
      hideContextMenu();
      if (!id) return;

      if (action === 'link') {
        const pOut = getPortCoords(id, 'out');
        const screenX = pOut.x * scale + pan.x;
        const screenY = pOut.y * scale + pan.y;
        startLinking(id, screenX, screenY);
        showToast('Agora clique ou leve o cursor até o balão de destino');
      } else if (action === 'duplicate') {
        const orig = nodes.find(n => n.id === id);
        if (orig) {
          const copy = { ...orig, id: 'n_' + Date.now(), x: orig.x + 40, y: orig.y + 40 };
          nodes.push(copy);
          selectNode(copy.id);
          renderAll();
          showToast('Balão duplicado');
        }
      } else if (action === 'unlink') {
        edges = edges.filter(e => e.from !== id && e.to !== id);
        renderEdges();
        showToast('Ligações do balão removidas');
      } else if (action === 'delete') {
        deleteNode(id);
      }
    }

    /* EVENTOS DE CANVAS (MOUSE E TOUCH DIRETO) */
    viewport.addEventListener('mousedown', e => {
      hideContextMenu();
      if (e.target === viewport || e.target === world || e.target === svgLayer) {
        if (linkingFrom) {
          cancelLinking();
          return;
        }
        isPanning = true;
        panStart.x = e.clientX - pan.x;
        panStart.y = e.clientY - pan.y;
      }
    });

    viewport.addEventListener('touchstart', e => {
      hideContextMenu();
      if (e.target === viewport || e.target === world || e.target === svgLayer) {
        if (linkingFrom) {
          cancelLinking();
          return;
        }
        const t = e.touches[0];
        isPanning = true;
        panStart.x = t.clientX - pan.x;
        panStart.y = t.clientY - pan.y;
      }
    }, { passive: true });

    window.addEventListener('mousemove', e => {
      if (isPanning) {
        pan.x = e.clientX - panStart.x;
        pan.y = e.clientY - panStart.y;
        updateTransform();
      } else if (draggingNode) {
        draggingNode.x = (e.clientX - pan.x) / scale - dragOffset.x;
        draggingNode.y = (e.clientY - pan.y) / scale - dragOffset.y;
        const el = nodesLayer.querySelector(`.node[data-id="${draggingNode.id}"]`);
        if (el) {
          el.style.left = draggingNode.x + 'px';
          el.style.top = draggingNode.y + 'px';
        }
        renderEdges();
      } else if (linkingFrom) {
        updateTempWire(e.clientX, e.clientY);
      }
    });

    window.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (!t) return;
      if (isPanning) {
        pan.x = t.clientX - panStart.x;
        pan.y = t.clientY - panStart.y;
        updateTransform();
      } else if (draggingNode) {
        draggingNode.x = (t.clientX - pan.x) / scale - dragOffset.x;
        draggingNode.y = (t.clientY - pan.y) / scale - dragOffset.y;
        const el = nodesLayer.querySelector(`.node[data-id="${draggingNode.id}"]`);
        if (el) {
          el.style.left = draggingNode.x + 'px';
          el.style.top = draggingNode.y + 'px';
        }
        renderEdges();
      } else if (linkingFrom) {
        updateTempWire(t.clientX, t.clientY);
      }
    }, { passive: true });

    window.addEventListener('mouseup', e => {
      isPanning = false;
      draggingNode = null;
      if (linkingFrom) {
        const wx = (e.clientX - pan.x) / scale;
        const wy = (e.clientY - pan.y) / scale;
        const snapNode = findSnapNode(wx, wy);
        if (snapNode) finishLinking(snapNode.id);
        else cancelLinking();
      }
    });

    window.addEventListener('touchend', e => {
      isPanning = false;
      draggingNode = null;
      if (linkingFrom && e.changedTouches?.[0]) {
        const t = e.changedTouches[0];
        const wx = (t.clientX - pan.x) / scale;
        const wy = (t.clientY - pan.y) / scale;
        const snapNode = findSnapNode(wx, wy);
        if (snapNode) finishLinking(snapNode.id);
      }
    });

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.08 : -0.08;
      changeZoom(delta);
    }, { passive: false });

    function changeZoom(delta) {
      scale = Math.min(1.8, Math.max(0.4, +(scale + delta).toFixed(2)));
      updateTransform();
    }

    function resetView() {
      pan = { x: 60, y: 60 };
      scale = 1;
      updateTransform();
    }

    /* MOUSEPAD / TRACKPAD DIGITAL COM BOTÃO ESQUERDO E DIREITO */
    const touchSurface = document.getElementById('touch-surface');

    function setPadMode(mode) {
      padMode = mode;
      document.getElementById('mode-cursor').classList.toggle('active', mode === 'cursor');
      document.getElementById('mode-pan').classList.toggle('active', mode === 'pan');
      vCursor.style.display = mode === 'cursor' ? 'block' : 'none';
      if (mode === 'cursor') updateVirtualCursor();
    }

    function updateVirtualCursor() {
      cursorPos.x = Math.max(10, Math.min(window.innerWidth - 10, cursorPos.x));
      cursorPos.y = Math.max(58, Math.min(window.innerHeight - 10, cursorPos.y));
      vCursor.style.left = cursorPos.x + 'px';
      vCursor.style.top = cursorPos.y + 'px';

      if (draggingNode) {
        draggingNode.x = (cursorPos.x - pan.x) / scale - dragOffset.x;
        draggingNode.y = (cursorPos.y - pan.y) / scale - dragOffset.y;
        const el = nodesLayer.querySelector(`.node[data-id="${draggingNode.id}"]`);
        if (el) {
          el.style.left = draggingNode.x + 'px';
          el.style.top = draggingNode.y + 'px';
        }
        renderEdges();
      } else if (linkingFrom) {
        updateTempWire(cursorPos.x, cursorPos.y);
      }
    }

    function handlePadMove(clientX, clientY) {
      if (!padLastTouch) {
        padLastTouch = { x: clientX, y: clientY };
        return;
      }
      const dx = (clientX - padLastTouch.x) * 1.7;
      const dy = (clientY - padLastTouch.y) * 1.7;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) padTouchMoved = true;
      padLastTouch = { x: clientX, y: clientY };

      if (padMode === 'pan') {
        pan.x += dx;
        pan.y += dy;
        updateTransform();
      } else {
        vCursor.style.display = 'block';
        cursorPos.x += dx;
        cursorPos.y += dy;
        updateVirtualCursor();
      }
    }

    touchSurface.addEventListener('touchstart', e => {
      e.preventDefault();
      hideContextMenu();
      const t = e.touches[0];
      padLastTouch = { x: t.clientX, y: t.clientY };
      padTouchMoved = false;
    }, { passive: false });

    touchSurface.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      handlePadMove(t.clientX, t.clientY);
    }, { passive: false });

    touchSurface.addEventListener('touchend', e => {
      e.preventDefault();
      padLastTouch = null;
      // Toque rápido na superfície touch funciona como clique esquerdo
      if (!padTouchMoved && padMode === 'cursor') {
        performVirtualLeftClick();
      }
    });

    touchSurface.addEventListener('mousedown', e => {
      hideContextMenu();
      padLastTouch = { x: e.clientX, y: e.clientY };
      padTouchMoved = false;
      const onMove = ev => handlePadMove(ev.clientX, ev.clientY);
      const onUp = () => {
        padLastTouch = null;
        if (!padTouchMoved && padMode === 'cursor') performVirtualLeftClick();
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });

    function getElementUnderVirtualCursor() {
      vCursor.style.display = 'none';
      const el = document.elementFromPoint(cursorPos.x, cursorPos.y);
      vCursor.style.display = 'block';
      return el;
    }

    // BOTÃO ESQUERDO DO MOUSEPAD (Segurar para mover/ligar OU clique rápido para conectar/selecionar)
    function leftBtnDown(e) {
      if (e) e.preventDefault();
      hideContextMenu();
      setPadMode('cursor');
      vCursor.classList.add('clicking');
      document.getElementById('btn-left-click').classList.add('holding');
      leftHolding = true;

      const target = getElementUnderVirtualCursor();
      if (!target) return;

      // Se clicou no X de excluir balão
      const delBtn = target.closest('.node-del');
      if (delBtn) {
        deleteNode(delBtn.dataset.del);
        leftHolding = false;
        return;
      }

      // Se já estava ligando um fio e clicou no balão/entrada de destino -> Conecta!
      if (linkingFrom) {
        const portIn = target.closest('.port-in');
        const nodeEl = target.closest('.node');
        const destId = portIn ? portIn.dataset.node : (nodeEl ? nodeEl.dataset.id : null);
        if (destId && destId !== linkingFrom) {
          finishLinking(destId);
          leftHolding = false;
          return;
        }
      }

      // Se apertou na bolinha de saída -> Inicia linha fluida
      const portOut = target.closest('.port-out');
      if (portOut) {
        startLinking(portOut.dataset.node, cursorPos.x, cursorPos.y);
        return;
      }

      // Se apertou em um balão -> Seleciona e prepara para mover
      const nodeEl = target.closest('.node');
      if (nodeEl) {
        const node = nodes.find(n => n.id === nodeEl.dataset.id);
        if (node) {
          selectNode(node.id);
          draggingNode = node;
          dragOffset.x = (cursorPos.x - pan.x) / scale - node.x;
          dragOffset.y = (cursorPos.y - pan.y) / scale - node.y;
        }
      }
    }

    function leftBtnUp(e) {
      if (e) e.preventDefault();
      vCursor.classList.remove('clicking');
      document.getElementById('btn-left-click').classList.remove('holding');
      if (!leftHolding) return;
      leftHolding = false;

      if (draggingNode) {
        draggingNode = null;
      }

      // Se estava arrastando uma linha e soltou em cima de outro balão -> Conecta com snap!
      if (linkingFrom) {
        const wx = (cursorPos.x - pan.x) / scale;
        const wy = (cursorPos.y - pan.y) / scale;
        const snapNode = findSnapNode(wx, wy);
        if (snapNode) {
          finishLinking(snapNode.id);
        }
      }
    }

    function performVirtualLeftClick() {
      setPadMode('cursor');
      const target = getElementUnderVirtualCursor();
      if (!target) return;

      const delBtn = target.closest('.node-del');
      if (delBtn) {
        deleteNode(delBtn.dataset.del);
        return;
      }

      const portOut = target.closest('.port-out');
      const portIn = target.closest('.port-in');
      const nodeEl = target.closest('.node');

      if (!linkingFrom && portOut) {
        startLinking(portOut.dataset.node, cursorPos.x, cursorPos.y);
        showToast('Mova o cursor até o balão destino e clique em Esq ou toque no pad');
      } else if (linkingFrom && (portIn || nodeEl)) {
        const destId = portIn ? portIn.dataset.node : nodeEl.dataset.id;
        if (destId !== linkingFrom) finishLinking(destId);
      } else if (linkingFrom) {
        cancelLinking();
      } else if (nodeEl) {
        selectNode(nodeEl.dataset.id);
      }
    }

    // BOTÃO DIREITO DO MOUSEPAD (Abre menu de opções no cursor)
    function rightBtnClick(e) {
      if (e) e.preventDefault();
      setPadMode('cursor');
      const target = getElementUnderVirtualCursor();
      const nodeEl = target ? target.closest('.node') : null;
      const targetId = nodeEl ? nodeEl.dataset.id : selectedNodeId;

      if (targetId) {
        selectNode(targetId);
        openContextMenu(cursorPos.x, cursorPos.y, targetId);
      } else {
        showToast('Aponte o cursor para um balão e clique em Dir (Opções)');
      }
    }

   async function saveFlow(silent = false) {
      localStorage.setItem('zapjob_flow_v1', JSON.stringify({ nodes, edges }));
      let pwd = localStorage.getItem('panel_pwd');
      if (!pwd) {
        pwd = prompt('Digite a senha do painel para salvar o fluxo na nuvem:');
        if (pwd) localStorage.setItem('panel_pwd', pwd);
      }
      if (pwd) {
        const res = await fetch('/api/panel/flow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-panel-password': pwd },
          body: JSON.stringify({ nodes, edges })
        });
        if (!res.ok) {
          localStorage.removeItem('panel_pwd');
          alert('Senha incorreta! Clique em Salvar novamente e digite a senha certa.');
          return;
        }
      }
      if (!silent) showToast('Fluxo e mídias salvos na nuvem!');
    }

    function resetFlow() {
      if (confirm('Deseja limpar e restaurar o fluxo inicial?')) {
        localStorage.removeItem('zapjob_flow_v1');
        initDefaultFlow();
      }
    }

    function exportFlow() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ nodes, edges }, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', 'fluxo-automacao.json');
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    initDefaultFlow();
  </script>
</body>
</html>
